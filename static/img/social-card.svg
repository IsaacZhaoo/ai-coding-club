<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Dynamic gradient background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E40AF;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DB2777;stop-opacity:1" />
    </linearGradient>

    <!-- Tag gradient -->
    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#34D399;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A78BFA;stop-opacity:1" />
    </linearGradient>

    <!-- Sparkle gradient -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FBBF24;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>

    <!-- Glows -->
    <filter id="sparkleGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Decorative light rays -->
  <g opacity="0.12">
    <path d="M 0,315 Q 300,200 600,315 T 1200,315" stroke="white" stroke-width="2" fill="none"/>
    <path d="M 0,250 Q 300,150 600,250 T 1200,250" stroke="white" stroke-width="1" fill="none"/>
    <path d="M 0,380 Q 300,280 600,380 T 1200,380" stroke="white" stroke-width="1" fill="none"/>
  </g>

  <!-- Large logo on the left: < ✨ > -->
  <g transform="translate(220, 315)">
    <!-- Left bracket < -->
    <path d="M -70,-80 L -130,0 L -70,80"
          stroke="url(#tagGrad)" stroke-width="18" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Right bracket > -->
    <path d="M 70,-80 L 130,0 L 70,80"
          stroke="url(#tagGrad)" stroke-width="18" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Center sparkle - emoji-style four-pointed star -->
    <g filter="url(#sparkleGlow)">
      <!-- Main star body -->
      <path d="M 0,-36 L -8,-10 L -36,0 L -8,10 L 0,36 L 8,10 L 36,0 L 8,-10 Z"
            fill="url(#sparkleGrad)" stroke="none"/>

      <!-- Inner highlight for depth -->
      <path d="M 0,-28 L -6,-8 L -28,0 L -6,8 L 0,28 L 6,8 L 28,0 L 6,-8 Z"
            fill="#FCD34D" opacity="0.6"/>

      <!-- Center bright spot -->
      <circle cx="0" cy="0" r="8" fill="#FEF3C7"/>
    </g>
  </g>

  <!-- Text content -->
  <g transform="translate(520, 220)">
    <!-- Main title -->
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="82" font-weight="bold"
          fill="white" filter="url(#textShadow)">AI Coding Club</text>

    <!-- Tagline with sparkles -->
    <g transform="translate(0, 95)">
      <!-- Small sparkle accent -->
      <g transform="translate(-15, -15)" filter="url(#sparkleGlow)" opacity="0.8">
        <path d="M 0,-4 L -1,-1.5 L -4,0 L -1,1.5 L 0,4 L 1,1.5 L 4,0 L 1,-1.5 Z"
              fill="url(#sparkleGrad)" stroke="none"/>
        <circle cx="0" cy="0" r="1.5" fill="#FEF3C7"/>
      </g>

      <text x="0" y="0" font-family="Arial, sans-serif" font-size="42" font-weight="500"
            fill="#E0E7FF" filter="url(#textShadow)">Learn to code with AI</text>
    </g>

    <g transform="translate(0, 160)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="42" font-weight="500"
            fill="#E0E7FF" filter="url(#textShadow)">From zero to hero</text>

      <!-- Small sparkle accent -->
      <g transform="translate(410, -15)" filter="url(#sparkleGlow)" opacity="0.8">
        <path d="M 0,-4 L -1,-1.5 L -4,0 L -1,1.5 L 0,4 L 1,1.5 L 4,0 L 1,-1.5 Z"
              fill="url(#sparkleGrad)" stroke="none"/>
        <circle cx="0" cy="0" r="1.5" fill="#FEF3C7"/>
      </g>
    </g>

    <!-- Website URL -->
    <text x="0" y="230" font-family="Arial, sans-serif" font-size="32" font-weight="400"
          fill="#D1D5DB" opacity="0.9">aicoding.club</text>
  </g>

  <!-- Decorative sparkle accents -->
  <g transform="translate(1050, 120)" filter="url(#sparkleGlow)" opacity="0.6">
    <path d="M 0,-6 L -2,-2 L -6,0 L -2,2 L 0,6 L 2,2 L 6,0 L 2,-2 Z"
          fill="url(#sparkleGrad)" stroke="none"/>
    <circle cx="0" cy="0" r="2" fill="#FEF3C7"/>
  </g>

  <g transform="translate(1100, 500)" filter="url(#sparkleGlow)" opacity="0.5">
    <path d="M 0,-5 L -1.5,-1.5 L -5,0 L -1.5,1.5 L 0,5 L 1.5,1.5 L 5,0 L 1.5,-1.5 Z"
          fill="url(#sparkleGrad)" stroke="none"/>
    <circle cx="0" cy="0" r="2" fill="#FEF3C7"/>
  </g>
</svg>
