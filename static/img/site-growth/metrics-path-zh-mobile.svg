<svg xmlns="http://www.w3.org/2000/svg" width="640" height="820" viewBox="0 0 640 820" role="img" aria-labelledby="title desc">
  <title id="title">网站数据的四个观察位置</title>
  <desc id="desc">用户路径从搜索展示进入搜索点击，再到访问来源和任务完成。Search Console 与 Bing Webmaster Tools 观察搜索侧，GA4 观察网站侧。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="6" refY="9" orient="auto">
      <path d="M0 0L12 0L6 12Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="640" height="820" rx="28" fill="url(#background)"/>
  <g font-family="Inter, 'Noto Sans SC', system-ui, sans-serif" filter="url(#shadow)">
    <text x="40" y="48" fill="#94a3b8" font-size="18" font-weight="700" letter-spacing="2">搜索侧</text>
    <rect x="40" y="70" width="560" height="135" rx="20" fill="#172033" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="82" cy="112" r="18" fill="#0ea5e9"/>
    <text x="82" y="119" fill="#fff" font-size="17" font-weight="800" text-anchor="middle">1</text>
    <text x="120" y="118" fill="#f8fafc" font-size="32" font-weight="750">搜索展示</text>
    <text x="120" y="158" fill="#bae6fd" font-size="20">展示次数 · 平均位置</text>
    <text x="120" y="187" fill="#7dd3fc" font-size="16">Search Console · Bing Webmaster Tools</text>
    <path d="M320 211V244" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="40" y="250" width="560" height="135" rx="20" fill="#172033" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="82" cy="292" r="18" fill="#0ea5e9"/>
    <text x="82" y="299" fill="#fff" font-size="17" font-weight="800" text-anchor="middle">2</text>
    <text x="120" y="298" fill="#f8fafc" font-size="32" font-weight="750">搜索点击</text>
    <text x="120" y="338" fill="#bae6fd" font-size="20">点击次数 · 点击率</text>
    <path d="M320 391V424" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="40" y="438" fill="#94a3b8" font-size="18" font-weight="700" letter-spacing="2">网站侧</text>
    <rect x="40" y="450" width="560" height="135" rx="20" fill="#172033" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="82" cy="492" r="18" fill="#8b5cf6"/>
    <text x="82" y="499" fill="#fff" font-size="17" font-weight="800" text-anchor="middle">3</text>
    <text x="120" y="498" fill="#f8fafc" font-size="32" font-weight="750">访问来源</text>
    <text x="120" y="538" fill="#ddd6fe" font-size="20">用户 · 会话</text>
    <text x="120" y="567" fill="#c4b5fd" font-size="16">Google Analytics 4</text>
    <path d="M320 591V624" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="40" y="630" width="560" height="145" rx="20" fill="#172033" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="82" cy="672" r="18" fill="#8b5cf6"/>
    <text x="82" y="679" fill="#fff" font-size="17" font-weight="800" text-anchor="middle">4</text>
    <text x="120" y="678" fill="#f8fafc" font-size="32" font-weight="750">任务完成</text>
    <text x="120" y="718" fill="#ddd6fe" font-size="20">业务事件</text>
    <text x="120" y="749" fill="#c4b5fd" font-size="16">围绕网站核心任务配置</text>
  </g>
</svg>
